<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiloProxy</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="main.js"></script>
</head>
<body data-state="idle" data-view="home">

  <!-- Icon sprite (stroke icons, 24×24) -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a13.2 13.2 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 8 10 8a9.7 9.7 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
  </svg>

  <header class="bar">
    <img class="bar__logo" src="../../icons/logo.svg" alt="" width="24" height="24">
    <span class="bar__name"><b>KILO</b>PROXY</span>
    <span class="tag" id="tag">Direct</span>
  </header>

  <p class="notice" id="notice" role="alert" hidden></p>

  <!-- ── Home ─────────────────────────────────────────────── -->
  <main class="view" id="home">
    <section class="hero">
      <button class="orb" id="orb" type="button">
        <span class="orb__halo"></span>
        <span class="orb__arc"></span>
        <span class="orb__disc"><svg class="icon"><use href="#i-power"/></svg></span>
      </button>
      <h1 class="hero__status" id="status" aria-live="polite">Direct</h1>
      <p class="hero__detail" id="detail"></p>
    </section>

    <dl class="readout">
      <div><dt>Endpoint</dt><dd id="r-endpoint"></dd></div>
      <div><dt>Identity</dt><dd id="r-identity"></dd></div>
      <div><dt>Uptime</dt><dd id="r-uptime"></dd></div>
    </dl>

    <section class="section">
      <div class="section__head">
        <h2>Proxies <span class="count" id="count">0</span></h2>
        <button class="btn btn--ghost btn--sm" id="add" type="button">
          <svg class="icon"><use href="#i-plus"/></svg>Add
        </button>
      </div>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden>
        <svg class="icon"><use href="#i-shield"/></svg>
        <p>No proxies saved yet</p>
        <span>Paste <code>host:port:user:pass</code> to add one.</span>
      </div>
    </section>
  </main>

  <!-- ── Editor ───────────────────────────────────────────── -->
  <form class="view" id="editor" autocomplete="off" novalidate>
    <div class="editor__head">
      <button class="icon-btn" id="back" type="button" aria-label="Back" title="Back">
        <svg class="icon"><use href="#i-back"/></svg>
      </button>
      <h2 id="editor-title">New proxy</h2>
    </div>

    <label class="field">
      <span class="field__label">Quick paste</span>
      <input class="input input--paste" name="paste" placeholder="host:port:user:pass" spellcheck="false">
    </label>
    <p class="hint" id="hint" aria-live="polite"></p>

    <label class="field">
      <span class="field__label">Name <em>optional</em></span>
      <input class="input" name="name" placeholder="US residential" spellcheck="false">
    </label>

    <div class="grid grid--host">
      <label class="field">
        <span class="field__label">Host</span>
        <input class="input" name="host" placeholder="gw.example.com" spellcheck="false">
      </label>
      <label class="field">
        <span class="field__label">Port</span>
        <input class="input" name="port" placeholder="443" inputmode="numeric" maxlength="5">
      </label>
    </div>

    <div class="grid">
      <label class="field">
        <span class="field__label">User</span>
        <input class="input" name="user" placeholder="username" spellcheck="false">
      </label>
      <label class="field">
        <span class="field__label">Password</span>
        <span class="secret">
          <input class="input" name="pass" type="password" placeholder="••••••••">
          <button class="icon-btn" id="reveal" type="button" aria-label="Show password" title="Show password">
            <svg class="icon"><use href="#i-eye"/></svg>
          </button>
        </span>
      </label>
    </div>

    <fieldset class="field">
      <legend class="field__label">Protocol</legend>
      <div class="proto-row">
        <div class="segmented">
          <input type="radio" name="scheme" id="scheme-http" value="http" checked>
          <label for="scheme-http">HTTP</label>
          <input type="radio" name="scheme" id="scheme-https" value="https">
          <label for="scheme-https">HTTPS</label>
        </div>
        <label class="cc">
          <span class="field__label">Country</span>
          <input class="input input--cc" name="country" placeholder="bd" maxlength="2" autocapitalize="off" spellcheck="false" aria-label="Country (ISO)" title="ISO country, rewrites res-xx user">
        </label>
      </div>
    </fieldset>

    <div class="actions">
      <button class="btn btn--primary" id="save" type="submit">Save proxy</button>
      <button class="btn" id="cancel" type="button">Cancel</button>
    </div>
  </form>

  <footer class="foot">
    <span id="version"></span>
    <span>Stored locally · no telemetry</span>
  </footer>

  <template id="row-template">
    <li class="row">
      <button class="row__main" type="button">
        <span class="row__led" aria-hidden="true"></span>
        <span class="row__text">
          <span class="row__name"></span>
          <span class="row__addr"></span>
        </span>
        <span class="chip"></span>
      </button>
      <span class="row__actions">
        <button class="icon-btn" data-action="edit" type="button" aria-label="Edit" title="Edit">
          <svg class="icon"><use href="#i-edit"/></svg>
        </button>
        <button class="icon-btn icon-btn--danger" data-action="delete" type="button" aria-label="Delete" title="Delete">
          <svg class="icon"><use href="#i-trash"/></svg>
          <span class="icon-btn__confirm">Delete?</span>
        </button>
      </span>
    </li>
  </template>
</body>
</html>

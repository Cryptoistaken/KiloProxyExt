<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KiloProxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><span id="led" class="led"></span><b>KiloProxy</b></div>
    <button id="direct" class="ghost" title="Use a direct connection">Go direct</button>
  </header>
  <p id="state" class="state"></p>

  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>No proxies yet. Add one below.</p>

  <form id="form" autocomplete="off">
    <h2 id="formTitle">Add proxy</h2>
    <input id="paste" placeholder="Paste host:port:user:pass" spellcheck="false">
    <p id="hint" class="hint"></p>
    <input id="name" placeholder="Name (optional)">
    <div class="row">
      <input id="host" placeholder="Host" required spellcheck="false">
      <input id="port" placeholder="Port" type="number" min="1" max="65535" required>
    </div>
    <div class="row">
      <input id="user" placeholder="User" spellcheck="false">
      <input id="pass" placeholder="Password" type="password">
    </div>
    <select id="scheme" aria-label="Protocol">
      <option value="http">HTTP</option>
      <option value="https">HTTPS</option>
    </select>
    <div class="row actions">
      <button type="submit" class="primary" id="submit">Save</button>
      <button type="button" class="ghost" id="cancel" hidden>Cancel</button>
    </div>
  </form>
  <p id="error" class="error" role="alert"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
